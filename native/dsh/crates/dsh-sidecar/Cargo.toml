[package]
name = "dsh-sidecar"
description = "Rust migration-bridge sidecar executable with first-party capability services"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dsh-sidecar"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dsh-bridge-protocol = { path = "../dsh-bridge-protocol" }
dsh-bridge-runtime = { path = "../dsh-bridge-runtime" }
portable-pty = "0.9"
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
